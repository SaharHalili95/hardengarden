# Golden retrieval set (Phase 2). Written before the retriever was tuned.
# answerable: question -> the knowledge/ doc that must be retrieved (Recall@5).
# negative:   questions the knowledge base cannot answer; they must fall below the threshold.

answerable:
  # HG-SSH-001
  - q: Should the root user be able to log in over SSH?
