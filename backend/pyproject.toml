[project]
name = "hardengarden"
description = "AI-assisted Linux hardening auditor. Your system is a garden; HardenGarden finds the weeds."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sahar Halili" }]
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
# Runtime dependencies are added only in the phase that needs them,
# each with a justification in docs/DECISIONS.md (docs/REQUIREMENTS.md section 2, R29).
dependencies = [
    "chromadb>=1.0,<2",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "typer>=0.16,<1",
]

[project.scripts]
hardengarden = "hardengarden.cli:app"

[project.urls]
Repository = "https://github.com/SaharHalili95/hardengarden"
Issues = "https://github.com/SaharHalili95/hardengarden/issues"

[dependency-groups]
dev = [
  "bandit>=1.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "hardengarden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hardengarden"]
exclude = ["**/.gitkeep"]

[tool.hatch.build.targets.wheel.force-include]
# Original knowledge-base documents ship inside the package (never man pages, R19).
"../knowledge" = "hardengarden/kb_docs"

[tool.hatch.build.targets.sdist.force-include]
"../knowledge" = "knowledge"

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "S",        # flake8-bandit (second layer next to bandit, ADR-002 item 9)
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "DTZ",      # timezone-aware datetimes
  "T20",      # no print in library code
  "PT",       # pytest style
  "RET", "SIM", "PTH", "TRY", "PL", "RUF",
  "ANN",      # annotations everywhere
  "BLE",      # no blind except
  "ERA",      # no commented-out code
  "PGH",      # no blanket noqa / type: ignore (R24)
  "FIX",      # no TODO/FIXME/XXX/HACK (R23)
  "TD",
]

[tool.ruff.lint.per-file-ignores]
# Test-only relaxations (never applied to shipped code under hardengarden/):
#   S101 assert is the pytest idiom; PLR2004 literal expected values are the point of a test;
#   ANN401 monkeypatched fakes mirror Any-typed stdlib signatures; TRY003 inline messages in
#   fakes; S104 "0.0.0.0" appears as test data, never as a bind address; PLR0912 the R5
#   static scanner is one deliberate rule table.
"tests/**" = ["S101", "PLR2004", "ANN401", "TRY003", "S104", "PLR0912"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["hardengarden", "tests"]
mypy_path = "tests"
explicit_package_bases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "container: runs remediation templates in disposable Docker containers (needs Docker and root)",
  "live: evaluates a real local model through Ollama (manual / workflow_dispatch only)",
]
addopts = [
  "-m", "not container and not live",
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "--cov=hardengarden",
  "--cov-branch",
  "--cov-report=term-missing",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["hardengarden"]

[tool.coverage.report]
# Project-wide floor. Per-package gates (core/checks >= 90 %, api >= 85 %)
# are enforced in the phase that introduces them. Never lowered (R22).
fail_under = 85
show_missing = true
skip_covered = false

# ---------------------------------------------------------------- bandit
[tool.bandit]
targets = ["hardengarden"]
exclude_dirs = ["tests"]
