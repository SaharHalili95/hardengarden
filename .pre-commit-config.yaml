# Install once:  cd backend && uv run pre-commit install
# Run on demand: cd backend && uv run pre-commit run --all-files
#
# Python tools run as local hooks through `uv run`, so they use exactly the
# versions pinned in backend/uv.lock (same as CI). No version drift.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        exclude: \.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: bash -c 'cd backend && uv run bandit -c pyproject.toml -r hardengarden -q'
        language: system
        types: [python]
        pass_filenames: false
