name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for every job (threat model SC-3).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"          # fail if uv.lock is out of date; never re-resolve
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.30.1"
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - run: uv run mypy

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - run: uv run pytest
      - name: Per-package coverage gates (core, checks >= 90 %; api >= 85 %)
        run: |
          uv run coverage report --include='hardengarden/core/*' --fail-under=90
          uv run coverage report --include='hardengarden/checks/*' --fail-under=90
          uv run coverage report --include='hardengarden/api/*' --fail-under=85
      - name: shellcheck all remediation templates
        run: shellcheck -x hardengarden/remediation/templates/*.sh
      - name: Live scan of the runner (real Ubuntu 24.04, unprivileged)
        run: uv run hardengarden scan
      - name: Build wheel (pure Python, no native build; R34)
        run: uv build --wheel

  templates:
    name: Remediation templates in disposable containers
    # Heavier job (image build + apt): PRs to main and manual runs only (R30).
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - name: Run every template in a throwaway Ubuntu 24.04 container
        # Root is needed only to extract the container filesystem with its real owners.
        run: sudo --preserve-env=PATH,UV_LOCKED "$(command -v uv)" run --no-sync pytest -m container tests/remediation --no-cov

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - name: bandit
        run: uv run bandit -c pyproject.toml -r hardengarden
      - name: pip-audit (all locked dependencies, hash-verified)
        # Four chromadb advisories have no fix and affect only chromadb's HTTP server, which
        # HardenGarden never runs (embedded PersistentClient only). Justified in ADR-012 and
        # enforced by tests/security/test_chroma_usage.py. Every other advisory fails the build.
        run: |
          uv export --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes --strict \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c --ignore-vuln GHSA-36p7-vc44-83pf \
            --ignore-vuln GHSA-xph7-9rjv-w5fr --ignore-vuln GHSA-2wm9-hf6c-p5cr

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # scan the full history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (official release, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose --exit-code 1'

  frontend:
    name: Desktop UI (tsc, ESLint, Prettier, Vitest, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (version pinned by package.json "packageManager")
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
      - name: Install (lockfile only, install scripts disabled by .npmrc)
        run: pnpm install --frozen-lockfile
      - name: Dependency advisories (all UI dependencies, dev included)
        run: pnpm audit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against the production web build (mocked API)
        run: pnpm test:e2e
      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: desktop/playwright-report
          retention-days: 7

  desktop-shell:
    name: Desktop shell (Rust fmt, clippy, tests)
    # Built on Ubuntu 22.04: the glibc baseline for every native binary (R31).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the web assets the shell embeds
        run: pnpm build
      - name: Install the pinned Rust toolchain (src-tauri/rust-toolchain.toml)
        working-directory: desktop/src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - working-directory: desktop/src-tauri
        run: cargo fmt --check
      - working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: desktop/src-tauri
        run: cargo test --locked
