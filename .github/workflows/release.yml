name: Release

# Builds, tests, signs and publishes a release when a v* tag is pushed. A manual run builds and
# tests everything but publishes nothing (dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  COSIGN_VERSION: "v3.1.3"
  SYFT_VERSION: "1.54.1"

jobs:
  versions:
    name: Version strings match the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python3 packaging/check_versions.py --tag "$REF_NAME"
          else
            python3 packaging/check_versions.py
          fi

  scanner:
    name: Scanner bundle (PyInstaller --onedir) and wheel
    needs: versions
    # glibc baseline for every native binary (R31).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build the scanner (--onedir, never --onefile; R32)
        run: packaging/sidecar/build.sh dist/sidecar
      - name: glibc check (nothing newer than 2.35; R31)
        run: packaging/check_glibc.sh dist/sidecar
      - name: Packaged scanner smoke test on the build machine
        run: python3 packaging/tests/smoke_scanner.py dist/sidecar/hardengarden-sidecar/hardengarden-sidecar
      - name: Build the wheel (pure Python; R34)
        working-directory: backend
        run: uv build --wheel -o ../dist/wheel
      - name: Archive (keeps executable bits)
        run: tar -C dist/sidecar -czf dist/hardengarden-sidecar.tar.gz hardengarden-sidecar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner
          path: |
            dist/hardengarden-sidecar.tar.gz
            dist/wheel/*.whl
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop packages (.deb, .AppImage)
    needs: scanner
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Install the pinned Rust toolchain
        working-directory: desktop/src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanner
          path: dist
      - name: Unpack the scanner
        run: mkdir -p dist/sidecar && tar -C dist/sidecar -xzf dist/hardengarden-sidecar.tar.gz
      - name: Build the packages
        run: packaging/desktop/build.sh dist/sidecar/hardengarden-sidecar dist/desktop
      - name: glibc check on the app and everything inside the AppImage (R31)
        run: |
          set -euo pipefail
          packaging/check_glibc.sh dist/desktop/hardengarden-desktop
          appimage="$(realpath dist/desktop/hardengarden_*_x86_64.AppImage)"
          cd "$RUNNER_TEMP"
          "$appimage" --appimage-extract >/dev/null
          "$GITHUB_WORKSPACE"/packaging/check_glibc.sh squashfs-root
      - name: Record the build glibc for the release notes
        run: ldd --version | head -n 1 | awk '{print $NF}' > dist/desktop/glibc-version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop
          path: |
            dist/desktop/*.deb
            dist/desktop/*.AppImage
            dist/desktop/glibc-version.txt
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Install and run on ${{ matrix.image }}
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Provides the uv binary that gives Debian 12 and Ubuntu 22.04 a Python 3.12 for pipx.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/artifacts
      - name: Collect the release files
        run: |
          mkdir -p dist/release
          cp dist/artifacts/desktop/*.deb dist/artifacts/desktop/*.AppImage dist/release/
          cp dist/artifacts/scanner/wheel/*.whl dist/release/
          ls -l dist/release
      - name: .deb, pipx, desktop app, AppImage, scanner failure screen, noexec /tmp
        run: packaging/tests/run_distro_matrix.sh "${{ matrix.image }}" dist/release

  trivy:
    name: Trivy (fail on HIGH/CRITICAL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install Trivy (signature and checksum verified)
        run: packaging/install_trivy.sh "$RUNNER_TEMP/trivy"
      - name: Scan every lockfile (Python, npm, Rust)
        run: >
          "$RUNNER_TEMP/trivy/trivy" fs --scanners vuln --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml --exit-code 1 .

  publish:
    name: Sign and publish the pre-release
    needs: [scanner, desktop, smoke, trivy]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # Sigstore keyless signing with this workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # release notes need the history and the previous tag
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/artifacts
      - name: Collect the release files
        run: |
          mkdir -p dist/release
          cp dist/artifacts/desktop/*.deb dist/artifacts/desktop/*.AppImage dist/release/
          cp dist/artifacts/scanner/wheel/*.whl dist/release/
      - name: Install Syft (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          tarball="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${tarball}\$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" syft
      - name: SBOM (SPDX) of every locked dependency
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: >
          "$RUNNER_TEMP/syft" scan dir:. --exclude ./dist
          -o "spdx-json=dist/release/hardengarden-${GITHUB_REF_NAME}.spdx.json"
      - name: Checksums
        working-directory: dist/release
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Sign every file keyless (Sigstore, GitHub OIDC)
        working-directory: dist/release
        run: |
          set -euo pipefail
          for file in *; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Verify checksums and signatures before publishing
        working-directory: dist/release
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          for file in *; do
            case "$file" in *.sigstore.json) continue ;; esac
            cosign verify-blob "$file" --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Release notes from Conventional Commits
        run: >
          python3 packaging/release_notes.py --tag "$GITHUB_REF_NAME"
          --glibc "$(cat dist/artifacts/desktop/glibc-version.txt)" > "$RUNNER_TEMP/notes.md"
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/release/*
          --prerelease --verify-tag --title "HardenGarden $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
