[package]
name = "hardengarden-desktop"
version = "0.0.1"
description = "HardenGarden desktop app: a read-only Linux hardening auditor"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "hardengarden_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
